name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.1, v1.0.0, etc.

permissions:
  id-token: write
  contents: write  # Required for creating releases

jobs:
  build-npm:
    name: Build NPM Package
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: List all installed .NET SDKs
        run: dotnet --list-sdks

      - name: Create global.json to force SDK 8.0
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF
          cat global.json

      - name: Verify .NET version after global.json
        run: dotnet --version

      - name: Install .NET WASM workload
        run: dotnet workload install wasm-tools

      - name: Install dependencies
        run: npm ci

      - name: Create NPM package
        run: npm run package

      - name: Verify dist folder after build
        run: |
          echo "Contents of src/web/dist:"
          ls -lah src/web/dist/
          echo ""
          echo "WASM files in dist:"
          ls -lah src/web/dist/wasm/ || echo "No wasm folder in dist"

      - name: Upload NPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          retention-days: 5

  build-desktop:
    name: Build Desktop Apps
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact-name: SlickLadder-win-x64
            archive-ext: zip
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: SlickLadder-linux-x64
            archive-ext: tar.gz
          - os: macos-latest
            runtime: osx-x64
            artifact-name: SlickLadder-osx-x64
            archive-ext: tar.gz
          - os: macos-latest
            runtime: osx-arm64
            artifact-name: SlickLadder-osx-arm64
            archive-ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore examples/avalonia/SlickLadder.Avalonia.Demo.csproj

      - name: Publish Avalonia Demo
        run: dotnet publish examples/avalonia/SlickLadder.Avalonia.Demo.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.runtime }}

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd publish/${{ matrix.runtime }}
          7z a ../../${{ matrix.artifact-name }}.zip *

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd publish/${{ matrix.runtime }}
          tar -czf ../../${{ matrix.artifact-name }}.tar.gz *

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: '${{ matrix.artifact-name }}.${{ matrix.archive-ext }}'
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [build-npm, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release-notes.md

          # If release notes are empty, create a simple message
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](https://github.com/SlickQuant/slick-ladder/blob/main/CHANGELOG.md) for details." >> release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            artifacts/npm-package/*.tgz
            artifacts/SlickLadder-win-x64/SlickLadder-win-x64.zip
            artifacts/SlickLadder-linux-x64/SlickLadder-linux-x64.tar.gz
            artifacts/SlickLadder-osx-x64/SlickLadder-osx-x64.tar.gz
            artifacts/SlickLadder-osx-arm64/SlickLadder-osx-arm64.tar.gz
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    needs: [build-npm, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      DOTNET_NOLOGO: 'true'
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@slickquant'
          always-auth: true

      - name: Validate NPM token is present
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty or unavailable to this workflow. Check the GitHub Actions secret configuration."
            exit 1
          fi

      - name: Verify NPM token identity
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Download NPM package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm-package

      - name: Resolve package metadata
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./src/web/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./src/web/package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version v${TAG_VERSION} does not match src/web/package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

          mapfile -t TARBALLS < <(find artifacts/npm-package -maxdepth 1 -name '*.tgz' | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one npm tarball in artifacts/npm-package, found ${#TARBALLS[@]}"
            printf '%s\n' "${TARBALLS[@]}"
            exit 1
          fi

          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists on NPM
        id: npm-check
        run: |
          if npm view "${{ steps.package.outputs.package_name }}@${{ steps.package.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package ${{ steps.package.outputs.package_name }}@${{ steps.package.outputs.package_version }} is already published. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tarball to NPM
        if: steps.npm-check.outputs.exists != 'true'
        run: |
          set +e
          OUTPUT=$(npm publish "${{ steps.package.outputs.tarball }}" --access public 2>&1)
          STATUS=$?
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ] && echo "$OUTPUT" | grep -q "npm error code E404"; then
            echo "::error::npm publish returned E404. For @slickquant scoped packages, this usually means the token user does not have read/write access to the package or scope, or the token lacks package write and bypass-2FA permissions."
          fi

          if [ $STATUS -ne 0 ] && echo "$OUTPUT" | grep -q "npm error code EOTP"; then
            echo "::error::npm publish returned EOTP. The token authenticated successfully, but npm requires 2FA for publishing. Use a granular token with Bypass 2FA enabled, or switch this workflow to npm trusted publishing."
          fi

          exit $STATUS
